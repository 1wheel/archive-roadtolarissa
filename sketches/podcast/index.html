<!doctype html>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<link rel='stylesheet' href='style.css'>
<title>The Podcast Tour Detector</title>

<div class='podtour'>
  <h1>The Podcast Tour Detector</h1>

  <section class='c-tours'>
    <div class='controls'>
      <span class='ctl-label'>tour window: <b class='win-days'>30</b> days</span>
      <input type='range' class='win-slider' min='7' max='90' value='30'>
      <span class='search-wrap'><input type='text' class='guest-search' placeholder='find a guest&hellip;' autocomplete='off'><div class='suggest'></div></span>
      <span class='tour-count'></span>
    </div>
    <div class='chart'></div>
    <div class='chips'></div>
    <div class='multiples'></div>
  </section>

  <p class='sources'>Data: <a href='episodes.json'>episodes.json</a></p>
</div>

<script src='https://roadtolarissa.com/slinks/static-rss/d3_.js'></script>
<script src='draw-tours.js'></script>
<script src='init.js'></script>
